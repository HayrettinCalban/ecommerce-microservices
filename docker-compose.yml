services:
  redis:
    image: redis:7-alpine
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo-password
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  products:
    build: { context: ., dockerfile: Products/Dockerfile }
    ports: ["5001:8080"]
    environment:
      Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: demo
      RabbitMQ__Password: demo-password
      ConnectionStrings__Database: Data Source=/data/products.db
    volumes: ["products_data:/data"]
    depends_on:
      redis: { condition: service_started }
      rabbitmq: { condition: service_healthy }
  orders:
    build: { context: ., dockerfile: Orders/Dockerfile }
    ports: ["5002:8080"]
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: demo
      RabbitMQ__Password: demo-password
      ConnectionStrings__Database: Data Source=/data/orders.db
    volumes: ["orders_data:/data"]
    depends_on:
      rabbitmq: { condition: service_healthy }
volumes:
  products_data:
  orders_data:
