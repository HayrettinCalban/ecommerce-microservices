name: .NET build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Products/Products.csproj --configuration Release
      - run: dotnet build Orders/Orders.csproj --configuration Release
      - name: Start services
        run: docker compose up -d --build --wait
      - name: Exercise product and order endpoints
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:5001/products
          curl --fail -H 'Content-Type: application/json' -d '{"name":"Keyboard","price":120}' http://localhost:5001/products
          curl --fail -H 'Content-Type: application/json' -d '{"productId":1,"quantity":2}' http://localhost:5002/orders
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
