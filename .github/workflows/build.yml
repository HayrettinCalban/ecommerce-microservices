name: .NET build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Products/Products.csproj --configuration Release
      - run: dotnet build Orders/Orders.csproj --configuration Release
